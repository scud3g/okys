name: build-config

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - sources.json
      - merge.py

permissions:
  contents: write

concurrency:
  group: build-config
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取上游并合并去重
        run: python merge.py

      - name: 展示本次情况
        run: cat dist/report.txt

      - name: 提交产物
        run: |
          git config user.name "auto-build"
          git config user.email "auto-build@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 更新接口快照 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
